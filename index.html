<style>
:root{box-sizing:border-box;--bg:#f4f6fb;--cd:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--pr:#1d4ed8;--ok:#16a34a;--no:#dc2626;--wa:#d97706;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--cd:#121c33;--tx:#e8eefb;--mu:#98a6c3;--bd:#22304f;--pr:#5b8cff}}
:root[data-theme="dark"]{--bg:#0b1220;--cd:#121c33;--tx:#e8eefb;--mu:#98a6c3;--bd:#22304f;--pr:#5b8cff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;background:var(--cd);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700}.lg i{color:var(--ok);font-style:normal}
main{max-width:980px;margin:0 auto;padding:18px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
h3{margin:0 0 10px;font-size:16px}.mu{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:14px}.grid .card{margin:0}
.st{text-align:center}.st b{display:block;font-size:28px;color:var(--pr)}.st span{color:var(--mu);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea,button{font:inherit;padding:8px 11px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx)}
textarea{width:100%;min-height:90px}button{cursor:pointer}.pr{background:var(--pr);color:#fff;border-color:var(--pr)}
nav{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}nav button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:13px;font-weight:600}
.ch{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);font-size:12px;margin:2px}
.sb.p.on{background:var(--ok);color:#fff}.sb.a.on{background:var(--no);color:#fff}.sb.l.on{background:var(--wa);color:#fff}
.rep{border-top:1px solid var(--bd);padding:8px 0}.rep p{margin:4px 0 0}
.lw{max-width:400px;margin:30px auto;text-align:center}.lw input{width:100%;margin-bottom:8px}.er{color:var(--no);min-height:22px}.tg.on{background:var(--pr);color:#fff;border-color:var(--pr)}.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.dc{width:100%;padding:6px 0}.dc.p{background:var(--ok);color:#fff}.dc.a{background:var(--no);color:#fff}.dc.l{background:var(--wa);color:#fff}.dc.h{border-color:var(--pr)}.dc.on{outline:2px solid var(--pr)}#ms{max-height:340px;overflow:auto;margin-bottom:8px}.m{padding:6px 0;border-top:1px solid var(--bd)}.m img{max-width:240px;max-height:200px;border-radius:8px;display:block}.m audio{width:100%;max-width:300px}footer{text-align:center;padding:16px;color:var(--mu);font-size:13px}a{color:var(--pr)}.lk a{margin:0 6px}

button{position:relative;overflow:hidden;transition:transform .15s,box-shadow .2s,filter .2s}
button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 14px -6px rgba(29,78,216,.55);filter:brightness(1.06)}
button:active:not(:disabled){transform:scale(.95);box-shadow:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
input,select,textarea{transition:border-color .2s,box-shadow .2s}input:focus,select:focus,textarea:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(29,78,216,.15)}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}@keyframes rp{to{transform:scale(1);opacity:0}}
.verified{display:inline-flex;vertical-align:-3px;margin-left:4px;width:18px;height:18px;color:#229ED9}.verified svg{width:18px;height:18px}.profile-avatar{width:92px;height:92px;border-radius:50%;object-fit:cover;border:3px solid var(--bd);display:block}.profile-avatar-fallback{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--pr);color:#fff;font-size:30px;font-weight:800}.profile-photo-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.profile-photo-actions{display:flex;flex-direction:column;gap:7px}.verified-name{display:inline-flex;align-items:center;gap:2px}.ic{width:20px;height:20px;margin-right:6px;transition:transform .25s}.lk{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}.lk a{display:inline-flex;align-items:center;margin:0;text-decoration:none;font-weight:600}.lk a:hover .ic{transform:scale(1.25) rotate(-8deg)}
.br{display:grid;grid-template-columns:84px 1fr 46px;gap:8px;align-items:center;margin:7px 0}.br>div{height:12px;border-radius:9px;background:var(--bd);overflow:hidden}.br i{display:block;height:100%;border-radius:9px;background:var(--pr);transform-origin:left;animation:bar .9s cubic-bezier(.2,.8,.2,1) both}.br b{text-align:right;font-size:13px}@keyframes bar{from{transform:scaleX(0)}}
.tl polyline{stroke-dasharray:1;animation:dr 1.2s ease forwards}@keyframes dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.sw{background:rgba(217,119,6,.14);border-radius:8px;padding:2px 6px}
.tt{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:9;animation:tt .3s both}@keyframes tt{from{opacity:0;transform:translate(-50%,10px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.dgb{padding:3px 9px;color:var(--no);border-color:transparent;background:none;font-size:13px}.dgb:hover:not(:disabled){background:rgba(220,38,38,.12);box-shadow:none;filter:none}.dg{background:var(--no)!important;color:#fff!important}
.ad{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px dashed var(--bd);border-radius:14px;margin-bottom:14px;background:var(--cd);color:var(--tx);text-decoration:none;transition:transform .2s,border-color .2s}.ad:hover{transform:translateY(-2px);border-color:var(--pr)}.ad img{width:72px;height:72px;object-fit:cover;border-radius:10px}.ad div{display:flex;flex-direction:column;min-width:0}.ad small{font-size:11px}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;overflow:visible;box-shadow:0 8px 24px -6px rgba(29,78,216,.6);z-index:20}#fab svg{width:26px;height:26px}#fab .rp{display:none}#fab i{position:absolute;top:-4px;right:-4px;min-width:20px;padding:4px 5px;border-radius:99px;background:var(--no);color:#fff;font:700 12px/1 system-ui;text-align:center;animation:pop .3s}@keyframes pop{from{transform:scale(0)}}
.mg{position:fixed;inset:0;z-index:30;display:grid;grid-template-columns:320px 1fr;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:mgi .25s ease-out}@keyframes mgi{from{opacity:0;transform:translateY(24px)}}
.ml,.mc{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--cd)}.ml{border-right:1px solid var(--bd)}.mc{background:var(--bg)}
.mh{display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:58px;background:var(--cd);border-bottom:1px solid var(--bd)}.mh>div{flex:1;min-width:0}.mh small{display:block;color:var(--mu)}.mh button{border:0;background:none;padding:6px 10px;font-size:20px}.bk{display:none}
.mls{flex:1;overflow:auto}.mi{display:flex;gap:12px;align-items:center;padding:10px 14px;cursor:pointer;transition:background .15s}.mi:hover,.mi.on{background:var(--bg)}.mi>div{flex:1;min-width:0}.mi small{display:block;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mi em{background:var(--pr);color:#fff;font:700 12px/1 system-ui;padding:4px 7px;border-radius:99px;animation:pop .3s}
.av{width:44px;height:44px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font:700 16px system-ui}.mh .av{width:38px;height:38px;font-size:14px}
.mb{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:4px}.em{margin:auto;color:var(--mu)}
.bb{align-self:flex-start;max-width:min(80%,480px);padding:6px 11px 4px;background:var(--cd);border:1px solid var(--bd);border-radius:16px 16px 16px 4px;word-break:break-word;cursor:pointer;animation:bi .2s ease-out}.bb.me{align-self:flex-end;background:var(--pr);border-color:var(--pr);color:#fff;border-radius:16px 16px 4px 16px}@keyframes bi{from{opacity:0;transform:translateY(6px) scale(.97)}}
.bb b{display:block;font-size:13px}.bb small{display:block;text-align:right;font-size:11px;opacity:.7}.bb img{max-width:100%;border-radius:10px;display:block}.bb a{color:inherit}.xd{display:none;cursor:pointer;margin-left:6px}.bb.sel .xd,.bb:hover .xd{display:inline}.bb .dg{padding:0 6px;border-radius:6px}
.dd{align-self:center;margin:8px 0;padding:2px 10px;border-radius:99px;background:var(--bd);color:var(--mu);font-size:12px}
.mf{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--cd);border-top:1px solid var(--bd)}.mf #mt{flex:1;min-width:0;border-radius:99px;padding:10px 14px}.at{cursor:pointer;font-size:20px;padding:4px 6px}.at .ic,label.tg .ic{margin:0;vertical-align:middle}.sd{width:42px;height:42px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center}.sd svg{width:20px;height:20px}
@media(max-width:719px){.mg{grid-template-columns:1fr}.mg .mc{display:none}.mg.op .ml{display:none}.mg.op .mc{display:flex}.mg.op .bk{display:inline-block}}

.sb.e.on,.dc.e{background:#7c3aed;color:#fff}
.q{border-left:3px solid currentColor;padding:2px 8px;margin-bottom:4px;opacity:.8;font-size:13px}.rb,.pn{padding:6px 12px;background:var(--cd);border-top:1px solid var(--bd);font-size:13px;display:flex;justify-content:space-between;gap:8px}.sq{width:90px;border-radius:99px;padding:6px 10px}
@media print{header,nav,#fab,footer,.ad,button,.dgb{display:none!important}body{background:#fff}}

#ld{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);font:700 22px system-ui;color:var(--tx);transition:opacity .4s}#ld.out{opacity:0;pointer-events:none}#ld i{color:var(--ok);font-style:normal}.sp{width:38px;height:38px;border-radius:50%;border:4px solid var(--bd);border-top-color:var(--pr);animation:spn .8s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}
#pb{position:fixed;left:0;right:0;top:0;height:3px;z-index:98;transition:opacity .3s}#pb.out{opacity:0}#pb i{display:block;height:100%;background:var(--pr);transform-origin:left;animation:pbf 2s linear both}@keyframes pbf{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#cdp{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:98;background:var(--tx);color:var(--bg);padding:9px;border-radius:99px;display:flex;transition:opacity .3s;animation:tt .25s both}#cdp svg{width:22px;height:22px;animation:spn .6s linear infinite}#cdp.out{opacity:0}#cdp.nd{animation:nd .35s}@keyframes nd{25%{transform:translateX(calc(-50% - 6px))}75%{transform:translateX(calc(-50% + 6px))}}
body.cdw nav button:not(.on){opacity:.5;cursor:progress}

const BIOKEY='etx_passkeys_v1';
function bioStore(){S.bio=S.bio||{};return S.bio}
function bioSave(v){S.bio=v;save()}
function b64url(buf){return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function fromB64url(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);return Uint8Array.from(bin,c=>c.charCodeAt(0))}
function bioSupported(){return window.isSecureContext&&window.PublicKeyCredential&&navigator.credentials}
async function setupFaceID(){
  if(!me)return;
  const out=$('#bio-msg')||$('#pm');
  if(!bioSupported()){if(out)out.textContent=t('bioNo');return}
  try{
    const ch=crypto.getRandomValues(new Uint8Array(32));
    const uid=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('etexnikum:'+me.tech+':'+me.login));
    const rpId=(location.hostname||'localhost').split(':')[0];
    const cred=await navigator.credentials.create({publicKey:{
      challenge:ch,
      rp:{name:'eTexnikum',id:rpId},
      user:{id:uid,name:me.login,displayName:me.name},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},
      timeout:60000,
      attestation:'none'
    }});
    if(!cred)throw new Error('cancelled');
    const store=bioStore();store[me.login]={id:b64url(cred.rawId),user:me.login,tech:me.tech,created:Date.now(),rpId};bioSave(store);
    if(out)out.textContent='✓ '+t('bioOk');
    toast('✓ '+t('bioOk'));
  }catch(e){if(out)out.textContent=t('bioErr')}
}
async function faceLogin(){
  const msg=$('#bio-msg');
  if(!bioSupported()){if(msg)msg.textContent=t('bioNo');return}
  const l=($('#lg')||{}).value?.trim();
  if(!l){if(msg)msg.textContent=t('bioNeed');return}
  const u=S.users.find(x=>x.login==l),rec=bioStore()[l];
  if(!u||!rec){if(msg)msg.textContent=t('bioNeed');return}
  if(u.off||(S.techs.find(x=>x.id==u.tech)||{}).off){if(msg)msg.textContent=t('bad');return}
  try{
    const ch=crypto.getRandomValues(new Uint8Array(32));
    const recRp=rec.rpId||((location.hostname||'localhost').split(':')[0]);
    const cred=await navigator.credentials.get({publicKey:{
      challenge:ch,
      rpId:recRp,
      allowCredentials:[{type:'public-key',id:fromB64url(rec.id)}],
      userVerification:'required',
      timeout:60000
    }});
    if(!cred||b64url(cred.rawId)!==rec.id)throw new Error('bad credential');
    // Static-file prototype note: production must verify the WebAuthn assertion on the server.
    finishLogin(u);
  }catch(e){if(msg)msg.textContent=t('bioErr')}
}

const ids=a=>(a||'').split(',').filter(Boolean);
const dayrange=(g,d)=>S.users.filter(u=>u.role=='student'&&(!g||u.group==g));

/* ---------- ПОЛЬЗОВАТЕЛИ ---------- */
def('users','users','[роль] [--tech X]','Список пользователей',(a,f)=>ulist(S.users.filter(u=>(!a[0]||u.role==a[0])&&(!f.tech||u.tech==tech(f.tech).id))));
def('users','user','<q>','Подробно о пользователе',a=>{const u=user(a[0]);return JSON.stringify({...u,pw:'***',qrk:u.qrk?'set':undefined},null,1)});
def('users','find','<текст>','Поиск по имени/логину/телефону',a=>ulist(S.users.filter(u=>(u.name+u.login+(u.phone||'')).toLowerCase().includes(String(a[0]||'').toLowerCase()))));
def('users','whois','<логин>','Кто это',a=>{const u=user(a[0]);return`${u.name} · ${u.role} · ${tname(u.tech)} · ${gname(u.group)}`});
def('users','useradd','<имя> <логин> <роль> [колледж] [группа]','Создать пользователя (пароль сгенерируется)',(a,f)=>{if(a.length<3)need('<имя> <логин> <роль>');if(S.users.some(u=>u.login==a[1]))throw new Error('Логин занят');const p=f.pw||rnd(10),u={id:Date.now(),name:a[0],login:a[1],pw:HP(p),role:a[2],tech:a[3]?tech(a[3]).id:0};if(a[4])u.group=grp(a[4]).id;if(a[2]=='parent')u.kids=[];S.users.push(u);save();return`Создан #${u.id}. Пароль: ${p}`},1);
def('users','userdel','<q> --yes','Удалить пользователя',(a,f)=>{yes(f);const u=user(a[0]);if(u.role=='admin'&&S.users.filter(x=>x.role=='admin').length<2)throw new Error('Нельзя удалить единственного админа');S.users=S.users.filter(x=>x!=u);save();return'Удалён '+u.name},1);
def('users','block','<q>','Заблокировать',a=>{const u=user(a[0]);u.off=true;save();return'⛔ '+u.name},1);
def('users','unblock','<q>','Разблокировать',a=>{const u=user(a[0]);u.off=false;save();return'✓ '+u.name},1);
def('users','passwd','<q> [пароль]','Сменить пароль',(a)=>{const u=user(a[0]),p=a[1]||rnd(10);u.pw=HP(p);u.mc=1;save();return`Новый пароль ${u.login}: ${p} (потребуется смена при входе)`},1);
def('users','mustchange','<q>','Потребовать смену пароля',a=>{user(a[0]).mc=1;save();return'ok'},1);
def('users','role','<q> <роль>','Назначить основную роль',a=>{const u=user(a[0]);u.role=a[1];u.rs=[a[1]];save();return u.name+' → '+a[1]},1);
def('users','roleadd','<q> <роль>','Добавить доп. роль',a=>{const u=user(a[0]);u.rs=[...new Set([...(u.rs||[u.role]),a[1]])];save();return u.rs.join(',')},1);
def('users','rolerm','<q> <роль>','Убрать доп. роль',a=>{const u=user(a[0]);u.rs=(u.rs||[u.role]).filter(r=>r!=a[1]);if(!u.rs.length)throw new Error('Нужна хотя бы одна роль');u.role=u.rs[0];save();return u.rs.join(',')},1);
def('users','setgroup','<q> <группа>','Перевести в группу',a=>{const u=user(a[0]),g=grp(a[1]);u.group=g.id;save();return u.name+' → '+g.name},1);
def('users','setphone','<q> <тел>','Телефон',a=>{const u=user(a[0]);u.phone=a[1];save();return'ok'},1);
def('users','rename','<q> <новое имя>','Переименовать',a=>{const u=user(a[0]);u.name=a.slice(1).join(' ');save();return'ok'},1);
def('users','setlogin','<q> <логин>','Сменить логин',a=>{const u=user(a[0]);if(S.users.some(x=>x.login==a[1]&&x!=u))throw new Error('Логин занят');u.login=a[1];save();return'ok'},1);
def('users','usertech','<q> <колледж>','Перенести в колледж',a=>{const u=user(a[0]);u.tech=tech(a[1]).id;u.group=0;save();return'ok'},1);
def('users','users.count','','Количество по ролям',()=>{const m={};S.users.forEach(u=>m[u.role]=(m[u.role]||0)+1);return Object.entries(m).map(([k,v])=>k.padEnd(10)+v).join('\n')});
def('users','users.off','','Заблокированные',()=>ulist(S.users.filter(u=>u.off)));
def('users','users.dup','','Дубли логинов/имён',()=>{const m={};S.users.forEach(u=>(m[u.login]=m[u.login]||[]).push(u.id));const d=Object.entries(m).filter(x=>x[1].length>1);return d.length?d.map(x=>x[0]+': '+x[1]).join('\n'):'дублей нет'});
def('users','users.nogroup','','Студенты без группы',()=>ulist(S.users.filter(u=>u.role=='student'&&!u.group)));
def('users','users.nophone','','Родители без телефона',()=>ulist(S.users.filter(u=>u.role=='parent'&&!u.phone)));
def('users','users.mc','','Кому нужна смена пароля',()=>ulist(S.users.filter(u=>u.mc)));
def('users','students','[группа]','Студенты',a=>ulist(S.users.filter(u=>u.role=='student'&&(!a[0]||u.group==grp(a[0]).id))));
def('users','staff','','Сотрудники',()=>ulist(S.users.filter(u=>['teacher','curator','deputy','guard','director'].includes(u.role))));
def('users','parents','','Родители',()=>ulist(S.users.filter(u=>u.role=='parent')));
def('users','admins','','Админы',()=>ulist(S.users.filter(u=>u.role=='admin')));
def('users','kids','<родитель>','Дети родителя',a=>{const p=user(a[0]);return ulist((p.kids||[]).map(i=>S.users.find(u=>u.id==i)).filter(Boolean))});
def('users','link','<родитель> <студент>','Привязать ребёнка',a=>{const p=user(a[0]),s=user(a[1]);p.kids=[...new Set([...(p.kids||[]),s.id])];p.kid=p.kid||s.id;save();return'ok'},1);
def('users','unlink','<родитель> <студент>','Отвязать ребёнка',a=>{const p=user(a[0]),s=user(a[1]);p.kids=(p.kids||[]).filter(i=>i!=s.id);save();return'ok'},1);
def('users','users.csv','','Выгрузка пользователей в CSV',()=>{const t='id,name,login,role,tech,group,phone\n'+S.users.map(u=>[u.id,u.name,u.login,u.role,tname(u.tech),gname(u.group),u.phone||''].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');dl('users.csv',t,'text/csv');return'Скачан users.csv'});
def('users','lastlogin','<q>','Последние входы',a=>{const u=user(a[0]);return(S.lg||[]).filter(x=>JSON.stringify(x).includes(u.login)||x.u==u.id).slice(-10).map(x=>JSON.stringify(x)).join('\n')||'нет данных'});

/* ---------- КОЛЛЕДЖИ / ГРУППЫ ---------- */
def('techs','techs','','Список колледжей',()=>tb(['id','название','город','директор','польз.','сайт'],S.techs.map(t=>[t.id,t.name,t.city,t.dir,S.users.filter(u=>u.tech==t.id).length,t.pub&&t.pub.on?'#/c/'+(t.pub.slug||t.id):'—'])));
def('techs','tech','<q>','Карточка колледжа',a=>JSON.stringify({...tech(a[0]),pub:undefined},null,1));
def('techs','techadd','<название> <город> <директор> <логин> [пароль]','Создать колледж и директора',a=>{if(a.length<4)need('<название> <город> <директор> <логин>');if(S.users.some(u=>u.login==a[3]))throw new Error('Логин занят');const id=Date.now(),p=a[4]||rnd(10);S.techs.push({id,name:a[0],city:a[1],dir:a[2]});S.users.push({id:id+1,name:a[2],login:a[3],pw:HP(p),mc:1,role:'director',tech:id});save();return`Создан #${id}. Директор ${a[3]} / ${p}`},1);
def('techs','techdel','<q> --yes','Удалить колледж со всеми данными',(a,f)=>{yes(f);const t=tech(a[0]),gi=S.groups.filter(g=>g.tech==t.id).map(g=>g.id);S.users=S.users.filter(u=>u.tech!=t.id);S.sch=S.sch.filter(x=>!gi.includes(x.g));['groups','msgs','news','hw','reports','rp','log','rq','mt','qz','ev','pl','fix','adm'].forEach(c=>S[c]=(S[c]||[]).filter(x=>x.tech!=t.id));S.techs=S.techs.filter(x=>x!=t);save();return'Удалён '+t.name},1);
def('techs','techrename','<q> <имя>','Переименовать',a=>{const t=tech(a[0]);t.name=a.slice(1).join(' ');save();return'ok'},1);
def('techs','techcity','<q> <город>','Сменить город',a=>{tech(a[0]).city=a[1];save();return'ok'},1);
def('techs','techoff','<q>','Отключить колледж',a=>{tech(a[0]).off=true;save();return'⛔'},1);
def('techs','techon','<q>','Включить колледж',a=>{tech(a[0]).off=false;save();return'✓'},1);
def('techs','techstats','[q]','Статистика колледжей',a=>(a[0]?[tech(a[0])]:S.techs).map(t=>{const us=S.users.filter(u=>u.tech==t.id);return`${t.name}: польз. ${us.length}, студ. ${us.filter(u=>u.role=='student').length}, групп ${S.groups.filter(g=>g.tech==t.id).length}, сообщ. ${S.msgs.filter(m=>m.tech==t.id).length}, ремонт ${S.fix.filter(x=>x.tech==t.id).length}`}).join('\n'));
def('techs','techusers','<q>','Пользователи колледжа',a=>ulist(S.users.filter(u=>u.tech==tech(a[0]).id)));
def('techs','techpub','<q> on|off','Публичная страница',a=>{const t=tech(a[0]);t.pub=t.pub||{};t.pub.on=a[1]=='on';save();return t.pub.on?'опубликована #/c/'+(t.pub.slug||t.id):'скрыта'},1);
def('techs','techslug','<q> <адрес>','Адрес публичной страницы',a=>{const t=tech(a[0]),s=String(a[1]).toLowerCase().replace(/[^\w-]/g,'');if(S.techs.some(x=>x!=t&&(x.pub&&x.pub.slug||x.id)==s))throw new Error('Адрес занят');t.pub=t.pub||{};t.pub.slug=s;save();return'#/c/'+s},1);
def('techs','techcolor','<q> <#hex>','Цвет бренда',a=>{if(!/^#[0-9a-f]{6}$/i.test(a[1]))throw new Error('Нужен #rrggbb');const t=tech(a[0]);t.pub=t.pub||{};t.pub.color=a[1];save();return'ok'},1);
def('techs','groups','[колледж]','Список групп',a=>tb(['id','группа','колледж','студ.'],S.groups.filter(g=>!a[0]||g.tech==tech(a[0]).id).map(g=>[g.id,g.name,tname(g.tech),S.users.filter(u=>u.group==g.id&&u.role=='student').length])));
def('techs','group','<q>','Состав группы',a=>{const g=grp(a[0]);return g.name+' ('+tname(g.tech)+')\n'+ulist(S.users.filter(u=>u.group==g.id))});
def('techs','groupadd','<колледж> <название>','Создать группу',a=>{const t=tech(a[0]);S.groups.push({id:Date.now(),name:a.slice(1).join(' '),tech:t.id});save();return'ok'},1);
def('techs','grouprename','<q> <имя>','Переименовать группу',a=>{grp(a[0]).name=a.slice(1).join(' ');save();return'ok'},1);
def('techs','groupdel','<q> --yes','Удалить группу',(a,f)=>{yes(f);const g=grp(a[0]);S.groups=S.groups.filter(x=>x!=g);S.users.forEach(u=>{if(u.group==g.id)u.group=0});S.sch=S.sch.filter(x=>x.g!=g.id);S.hw=S.hw.filter(x=>x.group!=g.id);save();return'Удалена '+g.name},1);
def('techs','move','<студент> <группа>','Перевести студента',a=>{const u=user(a[0]),g=grp(a[1]);u.group=g.id;save();return'ok'},1);
def('techs','groups.empty','','Пустые группы',()=>S.groups.filter(g=>!S.users.some(u=>u.group==g.id)).map(g=>g.name).join('\n')||'нет');
def('techs','groupmove','<из> <в> --yes','Перевести всю группу',(a,f)=>{yes(f);const x=grp(a[0]),y=grp(a[1]);let n=0;S.users.forEach(u=>{if(u.group==x.id){u.group=y.id;n++}});save();return n+' переведено'},1);

/* ---------- ПОСЕЩАЕМОСТЬ ---------- */
const AT={p:'пришёл',a:'нет',l:'опоздал',e:'уважит.'};
def('att','att','[дата] [группа]','Посещаемость за день',a=>{const d=dt(a[0]),g=a[1]&&grp(a[1]).id;return tb(['студент','группа','отметка','время QR'],dayrange(g).map(u=>[u.name,gname(u.group),AT[S.att[d+'|'+u.id]]||'—',S.arr[d+'|'+u.id]||'']))});
def('att','attset','<студент> <дата> <p|a|l|e>','Поставить отметку за день',a=>{if(!AT[a[2]])throw new Error('p|a|l|e');S.att[dt(a[1])+'|'+user(a[0]).id]=a[2];save();return'ok'},1);
def('att','attclear','<студент> <дата>','Снять отметку',a=>{delete S.att[dt(a[1])+'|'+user(a[0]).id];save();return'ok'},1);
def('att','absent','[дата]','Отсутствующие',a=>{const d=dt(a[0]);return ulist(dayrange().filter(u=>S.att[d+'|'+u.id]=='a'))});
def('att','late','[дата]','Опоздавшие',a=>{const d=dt(a[0]);return ulist(dayrange().filter(u=>S.att[d+'|'+u.id]=='l'))});
def('att','noshow','[дата]','Без отметки',a=>{const d=dt(a[0]);return ulist(dayrange().filter(u=>!S.att[d+'|'+u.id]))});
def('att','arrivals','[дата]','Приходы по QR',a=>{const d=dt(a[0]);return Object.entries(S.arr).filter(x=>x[0].startsWith(d+'|')).sort((x,y)=>x[1].localeCompare(y[1])).map(([k,v])=>v+'  '+((S.users.find(u=>u.id==k.split('|')[1])||{}).name)).join('\n')||'нет'});
def('att','arrset','<студент> <дата> <HH:MM:SS>','Задать время прихода',a=>{S.arr[dt(a[1])+'|'+user(a[0]).id]=a[2];save();return'ok'},1);
def('att','attrate','<студент|группа> [дней=30]','Процент посещаемости',a=>{const days=+a[1]||30,u0=S.users.find(u=>u.login==a[0]||String(u.id)==a[0]),us=u0?[u0]:dayrange(grp(a[0]).id);let p=0,n=0;us.forEach(u=>{for(let i=0;i<days;i++){const d=new Date();d.setDate(d.getDate()-i);const k=d.getFullYear()+'-'+pd(d.getMonth()+1)+'-'+pd(d.getDate())+'|'+u.id,v=S.att[k];if(v){n++;if(v=='p'||v=='l'||v=='e')p++}}});return n?Math.round(p/n*100)+'% ('+p+'/'+n+')':'нет данных'});
def('att','attl','<студент> [дата]','Отметки по парам',a=>{const u=user(a[0]);return Object.entries(S.attl).filter(([k])=>k.split('|')[2]==u.id&&(!a[1]||k.startsWith(a[1]))).sort().map(([k,v])=>k.split('|').slice(0,2).join(' #')+'  '+v.k+'  '+(v.j||'')).join('\n')||'нет'});
def('att','pairset','<студент> <дата> <пара> <p|a|l|e> [предмет]','Отметка за пару',a=>{S.attl[dt(a[1])+'|'+(+a[2]-1)+'|'+user(a[0]).id]={k:a[3],j:a[4]||'',by:'console',t:today()};save();return'ok'},1);
def('att','pairclear','<студент> <дата> <пара>','Снять отметку пары',a=>{delete S.attl[dt(a[1])+'|'+(+a[2]-1)+'|'+user(a[0]).id];save();return'ok'},1);
def('att','skips','[дней=30]','Прогулы по предметам',a=>{const m={};Object.entries(S.attl).forEach(([k,v])=>{if(v.k=='a')m[v.j||'—']=(m[v.j||'—']||0)+1});return Object.entries(m).sort((x,y)=>y[1]-x[1]).map(x=>x[0].padEnd(18)+x[1]).join('\n')||'нет'});
def('att','topskip','[n=10]','Больше всего прогулов',a=>{const m={};Object.entries(S.att).forEach(([k,v])=>{if(v=='a')m[k.split('|')[1]]=(m[k.split('|')[1]]||0)+1});return Object.entries(m).sort((x,y)=>y[1]-x[1]).slice(0,+a[0]||10).map(([id,n])=>((S.users.find(u=>u.id==id)||{}).name||id).padEnd(24)+n).join('\n')||'нет'});
def('att','attday.del','<дата> --yes','Удалить все отметки дня',(a,f)=>{yes(f);const d=dt(a[0]);let n=0;[S.att,S.arr,S.attl].forEach(m=>Object.keys(m).forEach(k=>{if(k.startsWith(d+'|')){delete m[k];n++}}));save();return n+' записей'},1);
def('att','attold','<дней> --yes','Удалить отметки старше N дней',(a,f)=>{yes(f);const lim=new Date();lim.setDate(lim.getDate()-(+a[0]||365));const c=lim.getFullYear()+'-'+pd(lim.getMonth()+1)+'-'+pd(lim.getDate());let n=0;[S.att,S.arr,S.attl].forEach(m=>Object.keys(m).forEach(k=>{if(k.split('|')[0]<c){delete m[k];n++}}));save();return n+' записей'},1);
def('att','attstat','','Общая статистика посещаемости',()=>{const m={};Object.values(S.att).forEach(v=>m[v]=(m[v]||0)+1);return Object.entries(m).map(([k,v])=>(AT[k]||k).padEnd(12)+v).join('\n')+'\nпо парам: '+Object.keys(S.attl).length+', QR: '+Object.keys(S.arr).length});

/* ---------- ОЦЕНКИ / ДЗ / НОВОСТИ ---------- */
const avg=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(2):'—';
def('study','grades','<студент>','Оценки студента',a=>{const u=user(a[0]);return S.grades.map((g,i)=>[i,g]).filter(x=>x[1].s==u.id).map(([i,g])=>`#${i}  ${g.d}  ${(g.j||'').padEnd(14)} ${g.g}`).join('\n')||'нет'});
def('study','avg','<студент|группа>','Средний балл',a=>{const u=S.users.find(x=>x.login==a[0]||String(x.id)==a[0]);if(u)return avg(S.grades.filter(g=>g.s==u.id).map(g=>g.g));const g=grp(a[0]);return avg(S.grades.filter(x=>(S.users.find(u=>u.id==x.s)||{}).group==g.id).map(x=>x.g))});
const rank=(n,dir)=>S.users.filter(u=>u.role=='student').map(u=>[u,avg2(u.id)]).filter(x=>x[1]).sort((x,y)=>dir*(y[1]-x[1])).slice(0,n).map(([u,v])=>u.name.padEnd(24)+v.toFixed(2)).join('\n');const avg2=id=>{const g=S.grades.filter(x=>x.s==id).map(x=>x.g);return g.length?g.reduce((a,b)=>a+b,0)/g.length:0};
def('study','top','[n=5]','Лучшие по баллу',a=>rank(+a[0]||5,1));
def('study','bottom','[n=5]','Худшие по баллу',a=>rank(+a[0]||5,-1));
def('study','gradeadd','<студент> <предмет> <оценка> [дата]','Добавить оценку',a=>{const u=user(a[0]);S.grades.push({s:u.id,j:a[1],g:+a[2],d:dt(a[3]),c:''});save();return'ok'},1);
def('study','gradedel','<индекс> --yes','Удалить оценку по индексу',(a,f)=>{yes(f);S.grades.splice(+a[0],1);save();return'ok'},1);
def('study','gradeset','<индекс> <оценка>','Исправить оценку',a=>{S.grades[+a[0]].g=+a[1];save();return'ok'},1);
def('study','gradestat','','Распределение оценок',()=>{const m={};S.grades.forEach(g=>m[g.g]=(m[g.g]||0)+1);return Object.entries(m).sort().map(([k,v])=>k+': '+'█'.repeat(Math.min(40,v))+' '+v).join('\n')});
def('study','subjects','','Предметы и средний балл',()=>{const m={};S.grades.forEach(g=>(m[g.j]=m[g.j]||[]).push(g.g));return Object.entries(m).map(([k,v])=>k.padEnd(18)+avg(v)+'  ('+v.length+')').join('\n')});

const tok=s=>{const r=[],re=/"([^"]*)"|'([^']*)'|(\S+)/g;let m;while(m=re.exec(s))r.push(m[1]??m[2]??m[3]);return r};

o('o',r)};

const cnPaint=()=>{const el=Q('#co');if(!el)return;el.innerHTML=CO.slice(-300).map(([k,t])=>`<div class="cl ${k}">${k=='c'?'<span>#</span> ':''}${esc(t)}</div>`).join('');el.scrollTop=el.scrollHeight};
window.cnKey=e=>{const i=e.target;if(e.key=='Enter'){const v=i.value;i.value='';cnRun(v)}else if(e.key=='ArrowUp'){e.preventDefault();hp=Math.max(0,hp-1);i.value=HI[hp]||''}else if(e.key=='ArrowDown'){e.preventDefault();hp=Math.min(HI.length,hp+1);i.value=HI[hp]||''}else if(e.key=='Tab'){e.preventDefault();const v=i.value;if(v.includes(' '))return;const m=Object.keys(CM).concat(Object.keys(AL)).filter(n=>n.startsWith(v));if(m.length==1)i.value=m[0]+' ';else if(m.length>1){o('i',m.join('  '));cnPaint()}}else if(e.key=='l'&&e.ctrlKey){e.preventDefault();CO=[];cnPaint()}};

.ta-card{background:var(--cd);border:1px solid var(--bd);border-radius:22px;padding:22px;margin-top:18px;box-shadow:0 14px 32px -20px rgba(15,23,42,.22)}
.ta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.ta-grid label,.ta-full{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mu)}
.ta-grid input,.ta-grid select,.ta-full textarea{width:100%;font:inherit;color:var(--tx)}
.ta-full{margin-top:14px}
.ta-btn{margin-top:16px;background:linear-gradient(135deg,var(--pr),#1e1b6b);color:#fff;border:0;padding:14px 26px;border-radius:14px;font-weight:700;box-shadow:0 12px 24px -12px var(--pr)}

/* ===== название без градиента: сплошное, «e» в цвет колледжа ===== */
.lg span{background:none!important;-webkit-text-fill-color:currentColor;color:var(--tx)}
.lg i{color:var(--pr);-webkit-text-fill-color:currentColor}
.home-brand .nm{background:none!important;-webkit-text-fill-color:currentColor;color:var(--tx)}
.home-brand .nm .e{color:var(--pr);-webkit-text-fill-color:currentColor}
.home-brand .nm .t{color:var(--tx);-webkit-text-fill-color:currentColor}

/* ===== название чуть жирнее ===== */
.lg,.lg span,.lg i{font-weight:900!important}
.home-brand .nm,.home-brand .nm .e,.home-brand .nm .t{font-weight:900!important}

/* ===== отдельная страница заявки ===== */
.home-apply-btn{background:var(--cd);color:var(--tx);border:1px solid var(--bd);padding:14px 22px;border-radius:14px;font-weight:700;margin-left:10px}
.home-apply-btn:hover{border-color:var(--pr);color:var(--pr)}
.ta-page{max-width:1080px;margin:0 auto;padding:24px 22px 40px}
.ta-back{background:none;border:0;color:var(--pr);font-weight:700;padding:6px 0;margin-bottom:6px;box-shadow:none}
.home-screen .ta-sec{padding-top:12px}
.soc-b{display:inline-flex;align-items:center;gap:8px}

/* ===== инструкция и подсказки ===== */
.hint{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--pr) 9%,transparent);border:1px solid color-mix(in srgb,var(--pr) 25%,transparent);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px;line-height:1.5;animation:m2up .4s both}
.hint b{color:var(--pr);flex:none}
.gd{background:var(--cd);border:1px solid var(--bd);border-radius:16px;margin:10px 0;padding:0 16px;transition:box-shadow .3s}
.gd[open]{box-shadow:0 12px 28px -18px rgba(15,23,42,.3)}
.gd summary{cursor:pointer;list-style:none;padding:14px 0;font-weight:700;display:flex;align-items:center;gap:10px}
.gd summary::-webkit-details-marker{display:none}
.gd summary::after{content:"＋";margin-left:auto;color:var(--mu);transition:transform .3s}
.gd[open] summary::after{content:"−";transform:rotate(180deg)}
.gn{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--pr);color:#fff;font-size:13px;flex:none}
.gd ol{margin:0 0 16px 40px;padding:0;line-height:1.6}
.gd li{margin:6px 0}

/* ===== меню по группам ===== */
nav{position:relative}
nav>button{flex:none}
.cg{position:relative;display:inline-block}
.cg-t{font-weight:700;background:var(--cd);border:1px solid var(--bd);display:inline-flex;align-items:center;gap:6px}
.cg.on .cg-t{background:var(--pr);color:#fff;border-color:var(--pr)}
.cg-a{font-size:12px;opacity:.8;transition:transform .25s}
.cg.open .cg-a{transform:rotate(180deg)}
.cg-p{display:none;position:absolute;top:calc(100% + 8px);left:0;z-index:60;min-width:240px;max-width:min(92vw,420px);background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:8px;box-shadow:0 24px 50px -18px rgba(15,23,42,.35);flex-direction:column;gap:4px}
.cg.open .cg-p{display:flex;animation:m2up .25s both}
.cg-p button{width:100%;text-align:left;justify-content:flex-start;background:none;border:0;padding:10px 12px;border-radius:10px;display:flex;align-items:center;gap:10px}
.cg-p button:hover{background:var(--bd)}
.cg-p button.on{background:color-mix(in srgb,var(--pr) 14%,transparent);color:var(--pr);font-weight:700}
@media(max-width:719px){.cg-p{left:-8px;min-width:min(88vw,300px)}}

const shrink=f=>new Promise(res=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.78))};im.onerror=()=>{URL.revokeObjectURL(u);res('')};im.src=u});

/* ===== администраторы колледжа: разделение прав директора ===== */
(()=>{
const T=(a,b,c)=>TL(a,b,c);
L.ru.tadmin='Администратор колледжа';L.uz.tadmin='Kollej administratori';L.en.tadmin='College admin';
L.ru.admins='Администраторы';L.uz.admins='Administratorlar';L.en.admins='Admins';

const BASIC=['home','overview','news','sched','sos','admins','guide'];
const adv=[...new Set(NAV.director)].filter(x=>!BASIC.includes(x));

const base=RS(u);u.rs=on?[...new Set([...base,'tadmin'])]:(base.filter(r=>r!='tadmin').length?base.filter(r=>r!='tadmin'):[u.role]);save();draw();toast('✓')};
V.admins=()=>{if(!RS(me).includes('director'))return none();
const staff=S.users.filter(u=>u.tech==me.tech&&u.id!=me.id&&!['student','parent','admin'].includes(u.role));
const on=staff.filter(u=>RS(u).includes('tadmin'));
return card(T('Администраторы колледжа','Kollej administratorlari','College admins'),`<p class=mu>${T('Администраторы управляют колледжем: сотрудниками, группами, расписанием, сайтом, SMS, ремонтом и публикациями. Директор остаётся с базовыми разделами.','Administratorlar kollejni boshqaradi. Direktor asosiy bo‘limlarda qoladi.','College admins manage staff, groups, schedule, site, SMS, repairs and posts. The director keeps the basic sections.')}</p>`)
+card(T('Сейчас администраторы','Hozirgi administratorlar','Current admins'),on.length?on.map(u=>`<div class=rep><b>${E(u.name)}</b> <small class=mu>${t(u.role)}</small> <button class=dgb onclick="tadminSet(${u.id},false)">${T('Снять права','Huquqni olish','Remove rights')}</button></div>`).join(''):none())
+card(T('Назначить администратора','Administrator tayinlash','Make an admin'),staff.filter(u=>!RS(u).includes('tadmin')).map(u=>`<div class=rep><b>${E(u.name)}</b> <small class=mu>${t(u.role)}</small> <button class=pr onclick="tadminSet(${u.id},true)">${T('Назначить администратором','Administrator qilish','Make college admin')}</button></div>`).join('')||none())};
})();

/* ===== меню по группам: «Главная» + 4 группы с выпадающими списками ===== */
(()=>{
const GRP=[
 ['Учёба','Ta’lim','Study',['grades','mygrades','hw','lib','att','myatt','pairs','mat','sched','report','rate']],
 ['Люди','Odamlar','People',['students','staff','admins','roles','qr','scan','camera','req','rq','sms','sos','guard']],
 ['Колледж','Kollej','College',['overview','dash','news','repair','gal','look','site','tapp','techs','ads','groups']],
 ['Система','Tizim','System',['prof','guide','console']]];
const keyOf=b=>{const m=/tab='(\w+)'/.exec(b.getAttribute('onclick')||'');return m?m[1]:''};
let OPEN=null;
const close=()=>{OPEN=null;document.querySelectorAll('.cg.open').forEach(x=>x.classList.remove('open'))};
document.addEventListener('click',e=>{if(!e.target.closest('.cg'))close()});
window.cgToggle=i=>{const el=document.querySelector(`.cg[data-i="${i}"]`);if(!el)return;const was=el.classList.contains('open');close();if(!was){el.classList.add('open');OPEN=i}};
function groupNav(){const nv=document.querySelector('nav');if(!nv||nv.dataset.g)return;const btns=[...nv.querySelectorAll('button')];if(btns.length<=6)return;
 nv.dataset.g=1;const used=new Set();const groups=GRP.map(([a,b,c,keys],i)=>{const items=btns.filter(x=>keys.includes(keyOf(x)));items.forEach(x=>used.add(x));return {i,label:TL(a,b,c),items}}).filter(g=>g.items.length);
 const rest=btns.filter(b=>!used.has(b)&&keyOf(b)!='home');const home=btns.find(b=>keyOf(b)=='home');
 nv.innerHTML='';if(home)nv.append(home);
 groups.forEach(g=>{const w=document.createElement('div');w.className='cg'+(g.items.some(x=>x.classList.contains('on'))?' on':'');w.dataset.i=g.i;
  const t=document.createElement('button');t.className='cg-t';t.innerHTML=`${g.label} <span class=cg-a>▾</span>`;t.onclick=e=>{e.stopPropagation();cgToggle(g.i)};
  const p=document.createElement('div');p.className='cg-p';g.items.forEach(x=>{x.addEventListener('click',()=>close());p.append(x)});w.append(t,p);nv.append(w)});
 if(rest.length){const w=document.createElement('div');w.className='cg';w.dataset.i=9;const t=document.createElement('button');t.className='cg-t';t.innerHTML=`${TL('Ещё','Yana','More')} <span class=cg-a>▾</span>`;t.onclick=e=>{e.stopPropagation();cgToggle(9)};const p=document.createElement('div');p.className='cg-p';rest.forEach(x=>p.append(x));w.append(t,p);nv.append(w)}
}
const d7=draw;draw=function(){d7.apply(this,arguments);try{groupNav()}catch(e){console.warn(e)}};
})();
