<style>
:root{box-sizing:border-box;--bg:#f4f6fb;--cd:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--pr:#1d4ed8;--ok:#16a34a;--no:#dc2626;--wa:#d97706;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--cd:#121c33;--tx:#e8eefb;--mu:#98a6c3;--bd:#22304f;--pr:#5b8cff}}
:root[data-theme="dark"]{--bg:#0b1220;--cd:#121c33;--tx:#e8eefb;--mu:#98a6c3;--bd:#22304f;--pr:#5b8cff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;background:var(--cd);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700}.lg i{color:var(--ok);font-style:normal}
main{max-width:980px;margin:0 auto;padding:18px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
h3{margin:0 0 10px;font-size:16px}.mu{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:14px}.grid .card{margin:0}
.st{text-align:center}.st b{display:block;font-size:28px;color:var(--pr)}.st span{color:var(--mu);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea,button{font:inherit;padding:8px 11px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx)}
textarea{width:100%;min-height:90px}button{cursor:pointer}.pr{background:var(--pr);color:#fff;border-color:var(--pr)}
nav{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}nav button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:13px;font-weight:600}
.ch{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);font-size:12px;margin:2px}
.sb.p.on{background:var(--ok);color:#fff}.sb.a.on{background:var(--no);color:#fff}.sb.l.on{background:var(--wa);color:#fff}
.rep{border-top:1px solid var(--bd);padding:8px 0}.rep p{margin:4px 0 0}
.lw{max-width:400px;margin:30px auto;text-align:center}.lw input{width:100%;margin-bottom:8px}.er{color:var(--no);min-height:22px}.tg.on{background:var(--pr);color:#fff;border-color:var(--pr)}.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.dc{width:100%;padding:6px 0}.dc.p{background:var(--ok);color:#fff}.dc.a{background:var(--no);color:#fff}.dc.l{background:var(--wa);color:#fff}.dc.h{border-color:var(--pr)}.dc.on{outline:2px solid var(--pr)}#ms{max-height:340px;overflow:auto;margin-bottom:8px}.m{padding:6px 0;border-top:1px solid var(--bd)}.m img{max-width:240px;max-height:200px;border-radius:8px;display:block}.m audio{width:100%;max-width:300px}footer{text-align:center;padding:16px;color:var(--mu);font-size:13px}a{color:var(--pr)}.lk a{margin:0 6px}

button{position:relative;overflow:hidden;transition:transform .15s,box-shadow .2s,filter .2s}
button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 14px -6px rgba(29,78,216,.55);filter:brightness(1.06)}
button:active:not(:disabled){transform:scale(.95);box-shadow:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
input,select,textarea{transition:border-color .2s,box-shadow .2s}input:focus,select:focus,textarea:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(29,78,216,.15)}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}@keyframes rp{to{transform:scale(1);opacity:0}}
.verified{display:inline-flex;vertical-align:-3px;margin-left:4px;width:18px;height:18px;color:#229ED9}.verified svg{width:18px;height:18px}.profile-avatar{width:92px;height:92px;border-radius:50%;object-fit:cover;border:3px solid var(--bd);display:block}.profile-avatar-fallback{width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--pr);color:#fff;font-size:30px;font-weight:800}.profile-photo-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.profile-photo-actions{display:flex;flex-direction:column;gap:7px}.verified-name{display:inline-flex;align-items:center;gap:2px}.ic{width:20px;height:20px;margin-right:6px;transition:transform .25s}.lk{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}.lk a{display:inline-flex;align-items:center;margin:0;text-decoration:none;font-weight:600}.lk a:hover .ic{transform:scale(1.25) rotate(-8deg)}
.br{display:grid;grid-template-columns:84px 1fr 46px;gap:8px;align-items:center;margin:7px 0}.br>div{height:12px;border-radius:9px;background:var(--bd);overflow:hidden}.br i{display:block;height:100%;border-radius:9px;background:var(--pr);transform-origin:left;animation:bar .9s cubic-bezier(.2,.8,.2,1) both}.br b{text-align:right;font-size:13px}@keyframes bar{from{transform:scaleX(0)}}
.tl polyline{stroke-dasharray:1;animation:dr 1.2s ease forwards}@keyframes dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.sw{background:rgba(217,119,6,.14);border-radius:8px;padding:2px 6px}
.tt{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:9;animation:tt .3s both}@keyframes tt{from{opacity:0;transform:translate(-50%,10px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.dgb{padding:3px 9px;color:var(--no);border-color:transparent;background:none;font-size:13px}.dgb:hover:not(:disabled){background:rgba(220,38,38,.12);box-shadow:none;filter:none}.dg{background:var(--no)!important;color:#fff!important}
.ad{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px dashed var(--bd);border-radius:14px;margin-bottom:14px;background:var(--cd);color:var(--tx);text-decoration:none;transition:transform .2s,border-color .2s}.ad:hover{transform:translateY(-2px);border-color:var(--pr)}.ad img{width:72px;height:72px;object-fit:cover;border-radius:10px}.ad div{display:flex;flex-direction:column;min-width:0}.ad small{font-size:11px}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;overflow:visible;box-shadow:0 8px 24px -6px rgba(29,78,216,.6);z-index:20}#fab svg{width:26px;height:26px}#fab .rp{display:none}#fab i{position:absolute;top:-4px;right:-4px;min-width:20px;padding:4px 5px;border-radius:99px;background:var(--no);color:#fff;font:700 12px/1 system-ui;text-align:center;animation:pop .3s}@keyframes pop{from{transform:scale(0)}}
.mg{position:fixed;inset:0;z-index:30;display:grid;grid-template-columns:320px 1fr;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:mgi .25s ease-out}@keyframes mgi{from{opacity:0;transform:translateY(24px)}}
.ml,.mc{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--cd)}.ml{border-right:1px solid var(--bd)}.mc{background:var(--bg)}
.mh{display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:58px;background:var(--cd);border-bottom:1px solid var(--bd)}.mh>div{flex:1;min-width:0}.mh small{display:block;color:var(--mu)}.mh button{border:0;background:none;padding:6px 10px;font-size:20px}.bk{display:none}
.mls{flex:1;overflow:auto}.mi{display:flex;gap:12px;align-items:center;padding:10px 14px;cursor:pointer;transition:background .15s}.mi:hover,.mi.on{background:var(--bg)}.mi>div{flex:1;min-width:0}.mi small{display:block;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mi em{background:var(--pr);color:#fff;font:700 12px/1 system-ui;padding:4px 7px;border-radius:99px;animation:pop .3s}
.av{width:44px;height:44px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font:700 16px system-ui}.mh .av{width:38px;height:38px;font-size:14px}
.mb{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:4px}.em{margin:auto;color:var(--mu)}
.bb{align-self:flex-start;max-width:min(80%,480px);padding:6px 11px 4px;background:var(--cd);border:1px solid var(--bd);border-radius:16px 16px 16px 4px;word-break:break-word;cursor:pointer;animation:bi .2s ease-out}.bb.me{align-self:flex-end;background:var(--pr);border-color:var(--pr);color:#fff;border-radius:16px 16px 4px 16px}@keyframes bi{from{opacity:0;transform:translateY(6px) scale(.97)}}
.bb b{display:block;font-size:13px}.bb small{display:block;text-align:right;font-size:11px;opacity:.7}.bb img{max-width:100%;border-radius:10px;display:block}.bb a{color:inherit}.xd{display:none;cursor:pointer;margin-left:6px}.bb.sel .xd,.bb:hover .xd{display:inline}.bb .dg{padding:0 6px;border-radius:6px}
.dd{align-self:center;margin:8px 0;padding:2px 10px;border-radius:99px;background:var(--bd);color:var(--mu);font-size:12px}
.mf{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--cd);border-top:1px solid var(--bd)}.mf #mt{flex:1;min-width:0;border-radius:99px;padding:10px 14px}.at{cursor:pointer;font-size:20px;padding:4px 6px}.at .ic,label.tg .ic{margin:0;vertical-align:middle}.sd{width:42px;height:42px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center}.sd svg{width:20px;height:20px}
@media(max-width:719px){.mg{grid-template-columns:1fr}.mg .mc{display:none}.mg.op .ml{display:none}.mg.op .mc{display:flex}.mg.op .bk{display:inline-block}}

.sb.e.on,.dc.e{background:#7c3aed;color:#fff}
.q{border-left:3px solid currentColor;padding:2px 8px;margin-bottom:4px;opacity:.8;font-size:13px}.rb,.pn{padding:6px 12px;background:var(--cd);border-top:1px solid var(--bd);font-size:13px;display:flex;justify-content:space-between;gap:8px}.sq{width:90px;border-radius:99px;padding:6px 10px}
@media print{header,nav,#fab,footer,.ad,button,.dgb{display:none!important}body{background:#fff}}

#ld{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);font:700 22px system-ui;color:var(--tx);transition:opacity .4s}#ld.out{opacity:0;pointer-events:none}#ld i{color:var(--ok);font-style:normal}.sp{width:38px;height:38px;border-radius:50%;border:4px solid var(--bd);border-top-color:var(--pr);animation:spn .8s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}
#pb{position:fixed;left:0;right:0;top:0;height:3px;z-index:98;transition:opacity .3s}#pb.out{opacity:0}#pb i{display:block;height:100%;background:var(--pr);transform-origin:left;animation:pbf 2s linear both}@keyframes pbf{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#cdp{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:98;background:var(--tx);color:var(--bg);padding:9px;border-radius:99px;display:flex;transition:opacity .3s;animation:tt .25s both}#cdp svg{width:22px;height:22px;animation:spn .6s linear infinite}#cdp.out{opacity:0}#cdp.nd{animation:nd .35s}@keyframes nd{25%{transform:translateX(calc(-50% - 6px))}75%{transform:translateX(calc(-50% + 6px))}}
body.cdw nav button:not(.on){opacity:.5;cursor:progress}

const BIOKEY='etx_passkeys_v1';
function bioStore(){S.bio=S.bio||{};return S.bio}
function bioSave(v){S.bio=v;save()}
function b64url(buf){return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function fromB64url(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);return Uint8Array.from(bin,c=>c.charCodeAt(0))}
function bioSupported(){return window.isSecureContext&&window.PublicKeyCredential&&navigator.credentials}
async function setupFaceID(){
  if(!me)return;
  const out=$('#bio-msg')||$('#pm');
  if(!bioSupported()){if(out)out.textContent=t('bioNo');return}
  try{
    const ch=crypto.getRandomValues(new Uint8Array(32));
    const uid=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('etexnikum:'+me.tech+':'+me.login));
    const rpId=(location.hostname||'localhost').split(':')[0];
    const cred=await navigator.credentials.create({publicKey:{
      challenge:ch,
      rp:{name:'eTexnikum',id:rpId},
      user:{id:uid,name:me.login,displayName:me.name},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},
      timeout:60000,
      attestation:'none'
    }});
    if(!cred)throw new Error('cancelled');
    const store=bioStore();store[me.login]={id:b64url(cred.rawId),user:me.login,tech:me.tech,created:Date.now(),rpId};bioSave(store);
    if(out)out.textContent='✓ '+t('bioOk');
    toast('✓ '+t('bioOk'));
  }catch(e){if(out)out.textContent=t('bioErr')}
}
async function faceLogin(){
  const msg=$('#bio-msg');
  if(!bioSupported()){if(msg)msg.textContent=t('bioNo');return}
  const l=($('#lg')||{}).value?.trim();
  if(!l){if(msg)msg.textContent=t('bioNeed');return}
  const u=S.users.find(x=>x.login==l),rec=bioStore()[l];
  if(!u||!rec){if(msg)msg.textContent=t('bioNeed');return}
  if(u.off||(S.techs.find(x=>x.id==u.tech)||{}).off){if(msg)msg.textContent=t('bad');return}
  try{
    const ch=crypto.getRandomValues(new Uint8Array(32));
    const recRp=rec.rpId||((location.hostname||'localhost').split(':')[0]);
    const cred=await navigator.credentials.get({publicKey:{
      challenge:ch,
      rpId:recRp,
      allowCredentials:[{type:'public-key',id:fromB64url(rec.id)}],
      userVerification:'required',
      timeout:60000
    }});
    if(!cred||b64url(cred.rawId)!==rec.id)throw new Error('bad credential');
    // Static-file prototype note: production must verify the WebAuthn assertion on the server.
    finishLogin(u);
  }catch(e){if(msg)msg.textContent=t('bioErr')}
}

/* ---- устройства: ТВ-режим и навигация пультом ---- */
const tvq=()=>document.documentElement.classList.toggle('tv',/SMART-?TV|Tizen|Web0S|webOS|NetCast|AppleTV|CrKey|BRAVIA|HbbTV|Android TV|GoogleTV|AFTT|AFTM/i.test(navigator.userAgent)||innerWidth>=1900);tvq();addEventListener('resize',tvq);
